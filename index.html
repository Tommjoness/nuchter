<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nuchter" />
  <meta name="theme-color" content="#0b0d14" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Nuchter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0d14;
      --s1: #11141c;
      --s2: #1a1e28;
      --line: rgba(238, 240, 245, 0.08);
      --line-strong: rgba(238, 240, 245, 0.14);
      --accent: #c4b5fd;
      --accent-line: rgba(196, 181, 253, 0.36);
      --positive: #4cc38a;
      --text: #eef0f5;
      --text2: #a3a9b8;
      --muted: #828a9e;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-sans: 'Outfit', system-ui, sans-serif;
    }

    html { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow-x: hidden;
      color-scheme: dark;
    }

    .app {
      max-width: 390px; min-height: 100dvh; margin: 0 auto;
      padding: 0 20px calc(env(safe-area-inset-bottom) + 32px);
      display: flex; flex-direction: column;
    }

    .header {
      padding: 48px 0 24px;
      text-align: center;
    }

    .header-title {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 44px;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--text);
    }

    .header-title em { color: var(--accent); font-style: normal; }

    .tabs {
      display: flex; gap: 4px;
      background: var(--s1);
      border: 1px solid var(--line);
      border-radius: 12px; padding: 4px;
      margin-bottom: 16px;
    }

    .tab {
      flex: 1; padding: 10px 8px;
      border: none; border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 14px; font-weight: 500; line-height: 20px;
      cursor: pointer;
      transition: background-color 150ms var(--ease), color 150ms var(--ease);
      background: none; color: var(--muted);
    }

    .tab:hover { color: var(--text2); }
    .tab.active { background: var(--s2); color: var(--text); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06); }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    main { flex: 1; display: flex; flex-direction: column; }
    .page { display: none; }
    .page.active { flex: 1; display: flex; flex-direction: column; gap: 12px; }

    .counter-block {
      background: var(--s1);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 40px 24px 32px;
      text-align: center;
    }

    .days-number {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(88px, 26vw, 120px);
      letter-spacing: -0.03em;
      line-height: 0.9;
      color: var(--text);
      display: block;
    }

    .days-label {
      font-size: 15px; font-weight: 400; line-height: 20px;
      color: var(--text2);
      margin-top: 12px;
      display: block;
    }

    .time-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    .time-card {
      background: var(--s1); border: 1px solid var(--line);
      border-radius: 16px; padding: 16px 8px;
      text-align: center; display: flex; flex-direction: column; gap: 4px;
    }

    .time-val {
      font-size: 24px; font-weight: 500; line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .time-unit {
      font-size: 13px; font-weight: 400; line-height: 16px;
      color: var(--muted);
    }

    .money-block {
      background: var(--s1); border: 1px solid var(--line);
      border-radius: 20px; padding: 24px;
      text-align: center;
    }

    .money-label {
      font-size: 13px; font-weight: 400; line-height: 16px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .money-amount {
      font-size: 32px; font-weight: 500; line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .motivation-line {
      padding: 24px 16px 0;
      text-align: center;
      font-family: var(--font-serif);
      font-size: 20px;
      line-height: 28px;
      color: var(--text2);
    }

    .milestones-block {
      background: var(--s1); border: 1px solid var(--line);
      border-radius: 20px; padding: 12px;
    }

    .milestone-list { display: flex; flex-direction: column; gap: 4px; }

    .milestone-item {
      border-radius: 8px; border: 1px solid var(--line);
      transition: border-color 150ms var(--ease);
    }
    .milestone-item.next { border-color: var(--accent-line); background: var(--s2); }
    .milestone-item:not(.next):hover { border-color: var(--line-strong); }

    .milestone-header {
      width: 100%; min-height: 44px;
      display: flex; align-items: center; gap: 12px;
      padding: 12px; cursor: pointer; user-select: none;
      border: 0; background: transparent; color: inherit; font: inherit; text-align: left;
      border-radius: 8px;
    }
    .milestone-header:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    .milestone-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--line-strong); }
    .milestone-item.done .milestone-dot { background: var(--positive); }
    .milestone-item.next .milestone-dot { background: var(--accent); }

    .milestone-days { flex: 1; font-size: 15px; line-height: 20px; color: var(--muted); }
    .milestone-item.done .milestone-days { color: var(--text2); }
    .milestone-item.next .milestone-days { color: var(--text); }

    .milestone-status {
      flex-shrink: 0;
      font-size: 13px; line-height: 16px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    .milestone-item.next .milestone-status { color: var(--text2); }

    .milestone-chevron {
      width: 16px; height: 16px; flex-shrink: 0;
      color: var(--muted);
      transition: transform 180ms var(--ease);
    }
    .milestone-item.open .milestone-chevron { transform: rotate(180deg); }

    .milestone-fact-wrap { display: none; padding: 0 12px 16px 32px; }
    .milestone-item.open .milestone-fact-wrap { display: block; }
    .milestone-facts { display: flex; flex-direction: column; gap: 12px; }
    .milestone-line { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start; }
    .milestone-category {
      font-size: 13px; font-weight: 500; line-height: 20px;
      color: var(--muted);
    }
    .milestone-copy { font-size: 14px; line-height: 20px; font-weight: 400; color: var(--text2); }
    .milestone-line.moment .milestone-copy { color: var(--text); }

    .milestone-note {
      margin-top: 16px;
      padding: 0 8px 4px;
      font-size: 13px;
      line-height: 20px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 340px) {
      .milestone-line { grid-template-columns: 1fr; gap: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-title">Nuchter<em>.</em></div>
  </header>

  <div class="tabs" role="tablist" aria-label="Nuchter overzicht">
    <button class="tab active" id="tab-vandaag" type="button" role="tab" aria-selected="true" aria-controls="page-vandaag" onclick="switchTab('vandaag')">Vandaag</button>
    <button class="tab" id="tab-mijlpalen" type="button" role="tab" aria-selected="false" aria-controls="page-mijlpalen" onclick="switchTab('mijlpalen')">Mijlpalen</button>
  </div>

  <main>
    <section class="page active" id="page-vandaag" role="tabpanel" aria-labelledby="tab-vandaag">
      <div class="counter-block">
        <span class="days-number" id="daysNumber">0</span>
        <span class="days-label" id="daysLabel">dagen nuchter</span>
      </div>

      <div class="time-row">
        <div class="time-card">
          <div class="time-val" id="hoursVal">0</div>
          <div class="time-unit">Uren</div>
        </div>
        <div class="time-card">
          <div class="time-val" id="weeksVal">0</div>
          <div class="time-unit">Weken</div>
        </div>
        <div class="time-card">
          <div class="time-val" id="monthsVal">0</div>
          <div class="time-unit">Maanden</div>
        </div>
      </div>

      <div class="money-block">
        <div class="money-label">Geld bespaard</div>
        <div class="money-amount" id="moneyAmount">€ 0,00</div>
      </div>

      <p class="motivation-line">Wat je vandaag volhoudt, maakt morgen net iets makkelijker.</p>
    </section>

    <section class="page" id="page-mijlpalen" role="tabpanel" aria-labelledby="tab-mijlpalen" hidden>
      <div class="milestones-block">
        <div class="milestone-list" id="milestoneList"></div>
        <p class="milestone-note">Bij iedereen verlopen veranderingen anders en op een ander moment. De gezondheidsteksten beschrijven mogelijke effecten; de mijlpalen vieren vooral wat jij opbouwt.</p>
      </div>
    </section>
  </main>
</div>

<script>
  const TIME_ZONE = 'Europe/Amsterdam';
  const START_AT = new Date('2026-08-20T00:00:00+02:00');
  const START_DATE = { year: 2026, month: 8, day: 20 };
  const RATE = 35.25;
  const DAY_MS = 86400000;
  const HOUR_MS = 3600000;
  const CHEVRON = '<svg class="milestone-chevron" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

  const dateFormatter = new Intl.DateTimeFormat('en-GB', {
    timeZone: TIME_ZONE,
    year: 'numeric',
    month: 'numeric',
    day: 'numeric',
  });

  const MILESTONES = [
    {
      days: 1,
      body: 'Je eerste volledige alcoholvrije dag. Je lichaam hoeft geen nieuwe alcohol te verwerken en krijgt zo een dag zonder extra belasting door alcohol.',
      mind: 'Alcohol kan je slaap verstoren. Zonder nieuwe alcohol krijgt je natuurlijke slaapritme weer ruimte, al kan je slaap in het begin nog wisselen.',
      moment: 'Dag één staat. Iedere lange reeks begint precies hier.'
    },
    {
      days: 3,
      body: 'Je lichaam heeft drie dagen geen nieuwe alcohol hoeven verwerken. Veranderingen in je vochtbalans, spijsvertering en energieniveau kunnen merkbaar worden, maar dat verschilt per persoon.',
      mind: 'Je slaap kan nog onrustig zijn, maar krijgt meerdere nachten achter elkaar de kans om zich zonder alcohol te stabiliseren.',
      moment: 'Drie dagen. Je bent niet alleen begonnen, je bent al bezig.'
    },
    {
      days: 7,
      body: 'Een volle week zonder alcohol betekent een week zonder nieuwe alcoholbelasting. Dat betekent minder belasting door alcohol voor onder meer je lever, hart- en vaatstelsel en stofwisseling.',
      mind: 'Sommige mensen merken dat ze helderder wakker worden of dat hun energie stabieler aanvoelt. Bij anderen duurt dat langer; beide zijn normaal.',
      moment: 'Zeven dagen. Een hele week die jij zelf hebt opgebouwd.'
    },
    {
      days: 14,
      body: 'Twee weken zonder alcohol geven je lichaam langer de tijd om te herstellen, zonder telkens opnieuw alcohol te hoeven verwerken.',
      mind: 'Slaap, concentratie en stemming kunnen geleidelijk verbeteren. Het tempo verschilt sterk per persoon.',
      moment: 'Twee weken. Je hoeft niet iedere dag verschil te voelen om vooruit te gaan.'
    },
    {
      days: 30,
      body: 'Na ongeveer een maand zonder alcohol zijn in onderzoek verbeteringen gezien in onder meer bloeddruk, gewicht, insulinegevoeligheid en leverwaarden.',
      mind: 'Na een maand zonder alcohol kunnen slaap, energie en mentale helderheid merkbaar anders aanvoelen.',
      moment: 'Een maand. Dertig dagen die je stuk voor stuk aan dezelfde reeks hebt toegevoegd.'
    },
    {
      days: 60,
      body: 'Twee maanden zonder alcohol betekenen twee maanden zonder nieuwe alcoholbelasting voor onder meer je lever, hart- en vaatstelsel en stofwisseling. In die periode bouw je geen nieuwe blootstelling aan alcohol op.',
      mind: 'Aandacht, geheugen, slaap en stemming kunnen verder herstellen. Dat verloopt niet volgens één vaste kalender.',
      moment: 'Twee maanden. Dit is inmiddels veel meer dan een goed voornemen.'
    },
    {
      days: 90,
      body: 'Drie maanden zonder alcohol geven je stofwisseling en hart- en vaatstelsel een lange periode zonder de directe effecten van alcohol.',
      mind: 'Na drie maanden krijg je een duidelijker beeld van hoe je natuurlijke slaap, energie en stemming zonder alcohol zijn.',
      moment: 'Negentig dagen. Wat begon als ‘vandaag niet’, is drie maanden geworden.'
    },
    {
      days: 100,
      body: 'Honderd dagen zonder alcohol betekenen honderd dagen zonder nieuwe alcoholblootstelling. Daardoor stapelt de belasting door alcohol zich in die periode niet verder op.',
      mind: 'Herstel van aandacht, geheugen en andere cognitieve functies kan maanden doorgaan, vooral na langduriger of zwaarder gebruik.',
      moment: '100. Drie cijfers. Dit mag je best even laten binnenkomen.'
    },
    {
      days: 180,
      body: 'Een half jaar zonder alcohol betekent een half jaar zonder nieuwe blootstelling aan alcohol, een bekende risicofactor voor onder meer leverziekte, hoge bloeddruk en meerdere vormen van kanker.',
      mind: 'Cognitief en emotioneel herstel kan nog maanden doorgaan. Langere tijd zonder alcohol geeft je brein daar tijd en ruimte voor.',
      moment: 'Een half jaar. Denk even terug aan dag één en kijk waar je nu staat.'
    },
    {
      days: 365,
      body: 'Een volledig jaar zonder alcohol betekent een jaar zonder nieuwe alcoholblootstelling. Dat verlaagt alcoholgerelateerde gezondheidsrisico’s ten opzichte van blijven drinken.',
      mind: 'Een jaar lang heeft alcohol je slaap, stemming en cognitieve functies niet direct kunnen verstoren.',
      moment: '365 dagen. Vier seizoenen, gewone dinsdagen, weekenden en alles ertussenin. En je bent doorgegaan.'
    },
  ];

  function getDateParts(date) {
    const parts = dateFormatter.formatToParts(date);
    const values = {};
    for (const part of parts) {
      if (part.type !== 'literal') values[part.type] = Number(part.value);
    }
    return { year: values.year, month: values.month, day: values.day };
  }

  function calendarDayIndex(parts) {
    return Math.floor(Date.UTC(parts.year, parts.month - 1, parts.day) / DAY_MS);
  }

  function getDays(now) {
    return Math.max(0, calendarDayIndex(getDateParts(now)) - calendarDayIndex(START_DATE));
  }

  function getHours(now) {
    return Math.max(0, Math.floor((now - START_AT) / HOUR_MS));
  }

  function getFullMonths(now) {
    const current = getDateParts(now);
    let months = (current.year - START_DATE.year) * 12 + (current.month - START_DATE.month);
    if (current.day < START_DATE.day) months -= 1;
    return Math.max(0, months);
  }

  function toggleMilestone(button) {
    const item = button.closest('.milestone-item');
    const isOpen = item.classList.toggle('open');
    button.setAttribute('aria-expanded', String(isOpen));
  }

  function renderMilestoneLine(category, className, text) {
    return '<div class="milestone-line ' + className + '">' +
      '<span class="milestone-category ' + className + '">' + category + '</span>' +
      '<span class="milestone-copy">' + text + '</span>' +
    '</div>';
  }

  function render() {
    const now = new Date();
    const days = getDays(now);
    const hours = getHours(now);
    const weeks = Math.floor(days / 7);
    const months = getFullMonths(now);
    const elapsedMs = Math.max(0, now - START_AT);
    const saved = (elapsedMs / DAY_MS / 7) * RATE;

    document.getElementById('daysNumber').textContent = days;
    document.getElementById('daysLabel').textContent = days === 1 ? 'dag nuchter' : 'dagen nuchter';
    document.getElementById('hoursVal').textContent = hours.toLocaleString('nl-NL');
    document.getElementById('weeksVal').textContent = weeks;
    document.getElementById('monthsVal').textContent = months;
    document.getElementById('moneyAmount').textContent = '€ ' + saved.toFixed(2).replace('.', ',');

    const nextMilestone = MILESTONES.find(m => m.days > days);

    document.getElementById('milestoneList').innerHTML = MILESTONES.map(m => {
      const done = days >= m.days;
      const isNext = Boolean(nextMilestone && m.days === nextMilestone.days);
      const remaining = Math.max(0, m.days - days);
      const label = m.days === 1 ? '1 dag' : m.days + ' dagen';
      const remainingLabel = remaining === 1 ? '1 dag' : remaining + ' dagen';
      let badge = '';

      if (done) badge = '<span class="milestone-status">behaald</span>';
      else if (isNext) badge = '<span class="milestone-status">nog ' + remainingLabel + '</span>';

      return '<div class="milestone-item ' + (done ? 'done' : isNext ? 'next' : '') + '">' +
        '<button class="milestone-header" type="button" aria-expanded="false" onclick="toggleMilestone(this)">' +
          '<span class="milestone-dot" aria-hidden="true"></span>' +
          '<span class="milestone-days">' + label + '</span>' +
          badge +
          CHEVRON +
        '</button>' +
        '<div class="milestone-fact-wrap"><div class="milestone-facts">' +
          renderMilestoneLine('Lichaam', 'body', m.body) +
          renderMilestoneLine('Hoofd', 'mind', m.mind) +
          renderMilestoneLine('Moment', 'moment', m.moment) +
        '</div></div>' +
      '</div>';
    }).join('');
  }

  function switchTab(tab) {
    const tabs = ['vandaag', 'mijlpalen'];
    for (const name of tabs) {
      const isActive = name === tab;
      const tabButton = document.getElementById('tab-' + name);
      const page = document.getElementById('page-' + name);
      tabButton.classList.toggle('active', isActive);
      tabButton.setAttribute('aria-selected', String(isActive));
      page.classList.toggle('active', isActive);
      page.hidden = !isActive;
    }
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(() => {});
  }

  render();
  setInterval(render, 60000);
</script>
</body>
</html>
